[package]
name = "gitdiff-tui"
version = "0.1.0"
edition = "2021"
description = "本地轻量 Git 终端客户端（TUI）"

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
tokio = { version = "1", features = ["full"] }
notify = "8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
dirs = "6"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-appender = "0.2"
anyhow = "1"
similar = "2"

[profile.release]
lto = true
codegen-units = 1
